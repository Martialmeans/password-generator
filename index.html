<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Generator</title>
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --border: #334155;
      --focus: #fbbf24;
      --radius: 10px;
      /* Strength level colors (also distinguished by segment count + label). */
      --weak: #ef4444;
      --fair: #f97316;
      --strong: #eab308;
      --very-strong: #22c55e;
    }

    /* ---------- Base / layout ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 34rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(1.25rem, 4vw, 2rem);
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(1.25rem, 4vw, 1.6rem);
      text-align: center;
    }

    /* ---------- Password display ---------- */
    .output-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    #password {
      flex: 1;
      min-width: 0;
      padding: 0.85rem 1rem;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 1.1rem;
      letter-spacing: 0.03em;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      /* Allow the user to select the password but not edit it. */
      cursor: text;
    }

    /* Secondary actions (Copy / Show-Hide) under the display. */
    .actions-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    /* ---------- Strength meter ---------- */
    .strength { margin-bottom: 1.5rem; }

    .meter {
      display: flex;
      gap: 4px;
      height: 10px;
      margin-bottom: 0.5rem;
    }

    .meter .seg {
      flex: 1;
      border-radius: 3px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .meter .seg.filled { border-color: transparent; }
    .meter[data-level="1"] .seg.filled { background: var(--weak); }
    .meter[data-level="2"] .seg.filled { background: var(--fair); }
    .meter[data-level="3"] .seg.filled { background: var(--strong); }
    .meter[data-level="4"] .seg.filled { background: var(--very-strong); }

    .strength-readout {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      margin: 0 0 0.25rem;
      font-size: 0.9rem;
    }

    .strength-label { font-weight: 700; }
    .strength-label.level-1 { color: var(--weak); }
    .strength-label.level-2 { color: var(--fair); }
    .strength-label.level-3 { color: var(--strong); }
    .strength-label.level-4 { color: var(--very-strong); }

    .strength-bits {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .strength-note {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* ---------- Buttons ---------- */
    button {
      padding: 0.85rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      color: #06283d;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover { background: var(--accent-strong); }

    .btn-secondary {
      flex: 1;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    /* Visible keyboard focus everywhere. */
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* ---------- Controls ---------- */
    fieldset {
      margin: 0 0 1.25rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    legend {
      padding: 0 0.5rem;
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }

    #length-value {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: 0.5rem 1rem;
    }

    .checkbox-grid label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.35rem 0.25rem;
      border-radius: 6px;
    }

    input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* ---------- Status message (live region) ---------- */
    #status {
      min-height: 1.25rem;
      margin: 1rem 0 0;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    #status.error { color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>Password Generator</h1>

    <!-- Password display: read-only so it can be selected/copied but not edited.
         Starts masked (type="password"); the Show/Hide button toggles the type. -->
    <div class="output-row">
      <input
        id="password"
        type="password"
        readonly
        aria-label="Generated password"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Click Generate"
      />
      <button id="generate" type="button">Generate</button>
    </div>

    <!-- Secondary actions -->
    <div class="actions-row">
      <button id="copy" type="button" class="btn-secondary" aria-label="Copy password to clipboard">Copy</button>
      <button id="toggle-visibility" type="button" class="btn-secondary" aria-pressed="false" aria-label="Show password">Show</button>
    </div>

    <!-- Strength meter. The level is also conveyed by the number of filled
         segments and by the text label, so it does not rely on color alone. -->
    <section class="strength" aria-labelledby="strength-heading">
      <h2 id="strength-heading" class="sr-only" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Password strength</h2>
      <div class="meter" id="meter" data-level="1" aria-hidden="true">
        <span class="seg"></span>
        <span class="seg"></span>
        <span class="seg"></span>
        <span class="seg"></span>
      </div>
      <p class="strength-readout">
        <span class="strength-label level-1" id="strength-label">—</span>
        <span class="strength-bits" id="strength-bits">0 bits</span>
      </p>
      <p class="strength-note" id="strength-note"></p>
    </section>

    <!-- Length slider with live readout -->
    <fieldset>
      <legend>Length</legend>
      <div class="slider-header">
        <label for="length">Password length</label>
        <output id="length-value" for="length">16</output>
      </div>
      <input type="range" id="length" min="8" max="64" value="16" step="1" />
    </fieldset>

    <!-- Character type selection -->
    <fieldset>
      <legend>Character types</legend>
      <div class="checkbox-grid">
        <label><input type="checkbox" id="lowercase" checked /> Lowercase (a-z)</label>
        <label><input type="checkbox" id="uppercase" checked /> Uppercase (A-Z)</label>
        <label><input type="checkbox" id="numbers" checked /> Numbers (0-9)</label>
        <label><input type="checkbox" id="symbols" checked /> Symbols (!@#$…)</label>
      </div>
      <div class="checkbox-grid" style="margin-top: 0.5rem;">
        <label><input type="checkbox" id="exclude-ambiguous" /> Exclude ambiguous (0, O, l, 1, I)</label>
      </div>
    </fieldset>

    <!-- Polite live region: announces status/errors without stealing focus. -->
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    "use strict";

    /* ---------- Character sets ---------- */
    const SETS = {
      lowercase: "abcdefghijklmnopqrstuvwxyz",
      uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      numbers: "0123456789",
      symbols: "!@#$%^&*()-_=+[]{};:,.<>?",
    };

    // Characters that are easy to confuse with one another.
    const AMBIGUOUS = "0Ol1I";

    // Strength tiers by entropy (bits). First tier whose `max` exceeds the
    // entropy wins; the last is open-ended.
    const STRENGTH_LEVELS = [
      { max: 40, label: "Weak", note: "Easily cracked — add length or more character types." },
      { max: 60, label: "Fair", note: "Could be cracked by a determined attacker." },
      { max: 90, label: "Strong", note: "Would take years to crack." },
      { max: Infinity, label: "Very strong", note: "Would take centuries to crack." },
    ];

    /* ---------- DOM references ---------- */
    const passwordEl = document.getElementById("password");
    const generateBtn = document.getElementById("generate");
    const copyBtn = document.getElementById("copy");
    const toggleBtn = document.getElementById("toggle-visibility");
    const lengthEl = document.getElementById("length");
    const lengthValueEl = document.getElementById("length-value");
    const statusEl = document.getElementById("status");
    const excludeAmbiguousEl = document.getElementById("exclude-ambiguous");
    const meterEl = document.getElementById("meter");
    const strengthLabelEl = document.getElementById("strength-label");
    const strengthBitsEl = document.getElementById("strength-bits");
    const strengthNoteEl = document.getElementById("strength-note");
    const meterSegments = Array.from(meterEl.querySelectorAll(".seg"));
    const typeCheckboxes = ["lowercase", "uppercase", "numbers", "symbols"].map(
      (id) => document.getElementById(id)
    );

    /* ---------- Randomness ---------- */

    /**
     * Return a uniform random integer in [0, maxExclusive).
     * Uses rejection sampling to avoid modulo bias: values in the final,
     * incomplete block that would make early numbers more likely are discarded.
     */
    function randomInt(maxExclusive) {
      if (maxExclusive <= 0) throw new RangeError("maxExclusive must be > 0");
      const buf = new Uint32Array(1);
      // Largest multiple of maxExclusive that fits in the 32-bit range.
      const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
      let x;
      do {
        crypto.getRandomValues(buf);
        x = buf[0];
      } while (x >= limit);
      return x % maxExclusive;
    }

    /** Pick one character at random from a string. */
    function pickRandom(str) {
      return str[randomInt(str.length)];
    }

    /** Fisher-Yates shuffle using unbiased random indices. */
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    /* ---------- Generation ---------- */

    /** Remove ambiguous characters from a set when that option is enabled. */
    function stripAmbiguous(set) {
      if (!excludeAmbiguousEl.checked) return set;
      return [...set].filter((c) => !AMBIGUOUS.includes(c)).join("");
    }

    /** Collect the character sets currently selected in the UI. */
    function getSelectedSets() {
      return typeCheckboxes
        .filter((cb) => cb.checked)
        .map((cb) => stripAmbiguous(SETS[cb.id]))
        .filter((set) => set.length > 0);
    }

    /**
     * Build a password of the given length.
     * Guarantees at least one character from every selected set, then shuffles
     * so the guaranteed characters are not predictably placed.
     */
    function generatePassword(length, sets) {
      const chars = [];

      // 1) One guaranteed character from each selected type.
      for (const set of sets) chars.push(pickRandom(set));

      // 2) Fill the remainder from the combined pool.
      const pool = sets.join("");
      while (chars.length < length) chars.push(pickRandom(pool));

      // 3) Shuffle so guaranteed positions are randomized.
      shuffle(chars);
      return chars.join("");
    }

    /* ---------- Strength ---------- */

    /**
     * Estimate password strength from entropy: bits = length * log2(poolSize).
     * Returns the rounded bit count, a 1-4 level, and its label/note.
     */
    function calculateStrength(length, poolSize) {
      const bits =
        poolSize > 0 ? Math.round(length * Math.log2(poolSize)) : 0;

      let level = STRENGTH_LEVELS.length;
      for (let i = 0; i < STRENGTH_LEVELS.length; i++) {
        if (bits < STRENGTH_LEVELS[i].max) {
          level = i + 1;
          break;
        }
      }

      const def = STRENGTH_LEVELS[level - 1];
      return { bits, level, label: def.label, note: def.note };
    }

    /** Paint the meter, label, bit count and note for a strength result. */
    function renderStrength(strength) {
      strengthLabelEl.textContent = strength.label;
      strengthLabelEl.className = "strength-label level-" + strength.level;
      strengthBitsEl.textContent = "~" + strength.bits + " bits";
      strengthNoteEl.textContent = strength.note;
      meterEl.dataset.level = String(strength.level);

      // Filled-segment count is a non-color cue for the level.
      meterSegments.forEach((seg, i) => {
        seg.classList.toggle("filled", i < strength.level);
      });
    }

    /* ---------- UI helpers ---------- */

    /** Show a message in the live region. `isError` styles it as a warning. */
    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    /** Keep the slider readout in sync with the slider value. */
    function updateLengthReadout() {
      lengthValueEl.textContent = lengthEl.value;
    }

    /**
     * Generate a fresh password from the current controls, display it and
     * update the strength meter.
     * `announce` controls whether the live region is updated (off while the
     * slider is being dragged, to avoid announcement spam).
     */
    function regenerate(announce = true) {
      const sets = getSelectedSets();
      const length = Number(lengthEl.value);

      passwordEl.value = generatePassword(length, sets); // DOM only; never logged/stored.

      const strength = calculateStrength(length, sets.join("").length);
      renderStrength(strength);

      if (announce) {
        setStatus(
          `Generated a ${length}-character password — ${strength.label.toLowerCase()}, about ${strength.bits} bits of entropy.`
        );
      }
    }

    /** Toggle the display between masked (password) and plain (text). */
    function setPasswordVisibility(visible) {
      passwordEl.type = visible ? "text" : "password";
      toggleBtn.textContent = visible ? "Hide" : "Show";
      toggleBtn.setAttribute("aria-pressed", String(visible));
      toggleBtn.setAttribute("aria-label", visible ? "Hide password" : "Show password");
    }

    /* ---------- Copy to clipboard ---------- */

    let copiedFeedbackTimer = null;

    /** Briefly change the Copy button label to confirm the action. */
    function flashCopied() {
      copyBtn.textContent = "Copied!";
      clearTimeout(copiedFeedbackTimer);
      copiedFeedbackTimer = setTimeout(() => {
        copyBtn.textContent = "Copy";
      }, 1500);
    }

    /**
     * Copy the current password to the clipboard.
     * Prefers the async Clipboard API; falls back to selecting the input and
     * using execCommand for non-secure contexts / older browsers.
     */
    async function copyPassword() {
      const value = passwordEl.value;
      if (!value) {
        setStatus("Nothing to copy yet — generate a password first.", true);
        return;
      }

      let ok = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(value);
          ok = true;
        }
      } catch (_) {
        ok = false;
      }

      if (!ok) {
        // Fallback: select the read-only input and copy via execCommand.
        passwordEl.select();
        try {
          ok = document.execCommand("copy");
        } catch (_) {
          ok = false;
        }
        const sel = window.getSelection && window.getSelection();
        if (sel) sel.removeAllRanges();
      }

      if (ok) {
        flashCopied();
        setStatus("Password copied to clipboard.");
      } else {
        setStatus("Copy failed — select the password and copy manually.", true);
      }
    }

    /* ---------- Event handlers ---------- */

    /**
     * Handle a character-type checkbox toggle.
     * If the user would uncheck the last remaining type, undo it and warn.
     * Otherwise regenerate so the display reflects the new selection.
     */
    function onTypeChange(event) {
      if (getSelectedSets().length === 0) {
        event.target.checked = true; // Revert: at least one type required.
        setStatus("At least one character type must stay selected.", true);
        return;
      }
      regenerate(true);
    }

    /* ---------- Wire up events ---------- */

    // Slider: regenerate live while dragging (silent), announce on release.
    lengthEl.addEventListener("input", () => {
      updateLengthReadout();
      regenerate(false);
    });
    lengthEl.addEventListener("change", () => regenerate(true));

    // Buttons and checkboxes.
    generateBtn.addEventListener("click", () => regenerate(true));
    copyBtn.addEventListener("click", copyPassword);
    toggleBtn.addEventListener("click", () => {
      setPasswordVisibility(passwordEl.type === "password");
    });
    typeCheckboxes.forEach((cb) => cb.addEventListener("change", onTypeChange));
    excludeAmbiguousEl.addEventListener("change", () => regenerate(true));

    /* ---------- Initial state ---------- */
    updateLengthReadout();
    setPasswordVisibility(false); // Start masked.
    regenerate(false);            // Show a sample password on load.
  </script>
</body>
</html>
